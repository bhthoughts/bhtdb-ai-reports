# Rebuild index.json + the README report table from git history whenever a
# report changes. Authorship is derived from commits, never self-declared.
# The bot commit touches only index.json/README.md, which are outside the
# reports/** path filter — no retrigger loop.
name: Update report index
on:
  push:
    branches: [main]
    paths: ["reports/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build index.json and README table
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/build_index.py
      - name: Commit the index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json README.md
          git diff --cached --quiet || git commit -m "Update report index"
          git push
